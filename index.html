<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>聆汐 | BONSKAZ MUSIC</title>

  <meta name="description" content="聆汐官方音樂入口｜Spotify、YouTube、Instagram、Facebook">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "PingFang TC",
        sans-serif;

      background:
        radial-gradient(circle at 50% -10%, #4b4650 0%, #252327 30%, #111113 62%, #070708 100%);

      color: #ffffff;
    }

    .page {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 28px 18px 54px;
    }

    .top-brand {
      text-align: center;
      margin-bottom: 26px;
    }

    .brand-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 5px;
      color: #b7b7bc;
    }

    .hero {
      position: relative;
      overflow: hidden;

      min-height: 340px;

      border-radius: 28px;

      background:
        radial-gradient(circle at 70% 20%, rgba(255,255,255,.15), transparent 26%),
        linear-gradient(145deg, #5e5a60 0%, #343136 45%, #1b1a1d 100%);

      display: flex;
      flex-direction: column;
      justify-content: flex-end;

      padding: 30px;

      box-shadow:
        0 25px 60px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.12);

      border: 1px solid rgba(255,255,255,.08);
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      right: -60px;
      top: -70px;

      background: rgba(255,255,255,.06);
      filter: blur(2px);
    }

    .hero::after {
      content: "聆汐";
      position: absolute;

      right: 22px;
      top: 35px;

      font-size: 76px;
      font-weight: 700;
      letter-spacing: 8px;

      color: rgba(255,255,255,.07);

      writing-mode: vertical-rl;
    }

    .artist-label {
      position: relative;
      z-index: 2;

      font-size: 13px;
      letter-spacing: 4px;
      color: #bdbdc2;
      margin-bottom: 8px;
    }

    .artist-name {
      position: relative;
      z-index: 2;

      margin: 0;
      font-size: 46px;
      letter-spacing: 5px;
      font-weight: 700;
    }

    .artist-desc {
      position: relative;
      z-index: 2;

      margin-top: 10px;

      font-size: 15px;
      color: #c8c8cc;
      line-height: 1.7;
    }

    .section-title {
      margin: 34px 4px 14px;

      font-size: 13px;
      letter-spacing: 3px;
      color: #8f8f95;
      font-weight: 700;
    }

    .link-card {
      display: flex;
      align-items: center;

      width: 100%;
      min-height: 76px;

      margin-bottom: 12px;
      padding: 0 18px;

      text-decoration: none;
      color: #fff;

      background: rgba(255,255,255,.085);

      border:
        1px solid rgba(255,255,255,.08);

      border-radius: 18px;

      backdrop-filter: blur(14px);

      transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease;
    }

    .link-card:active {
      transform: scale(.98);
      background: rgba(255,255,255,.14);
    }

    .logo-box {
      width: 46px;
      height: 46px;

      flex: 0 0 46px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      background: rgba(255,255,255,.10);

      margin-right: 15px;
    }

    .logo {
      width: 27px;
      height: 27px;
      display: block;
    }

    .link-text {
      flex: 1;
      min-width: 0;
    }

    .platform {
      font-size: 18px;
      font-weight: 650;
      margin-bottom: 3px;
    }

    .account {
      font-size: 12px;
      color: #9b9ba1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .arrow {
      font-size: 25px;
      color: #99999e;
      margin-left: 10px;
    }

    .future {
      margin-top: 25px;
      padding: 17px 18px;

      border-radius: 16px;

      border: 1px dashed rgba(255,255,255,.11);

      color: #77777c;

      font-size: 13px;
      line-height: 1.7;

      text-align: center;
    }

    footer {
      margin-top: 42px;
      text-align: center;

      color: #5f5f64;

      font-size: 11px;
      letter-spacing: 2px;
    }

    /* SVG */
    svg {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

      <div class="link-text">

    <div class="future">

    <footer>

  </main>

</body>
</html>
