<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>聆汐 | BONSKAZ MUSIC</title>

  <meta
    name="description"
    content="聆汐官方音樂與社群入口｜BONSKAZ MUSIC"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "PingFang TC",
        sans-serif;

      color: #ffffff;

      background:
        radial-gradient(
          circle at 50% -10%,
          #403b3d 0%,
          #242326 30%,
          #111113 62%,
          #070708 100%
        );
    }

    .page {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 28px 18px 55px;
    }

    .top-brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 5px;
      color: #b9b9bd;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 520px;
      overflow: hidden;
      border-radius: 28px;

      border: 1px solid rgba(255,255,255,.10);

      box-shadow:
        0 25px 65px rgba(0,0,0,.52);

      background: #19191b;
    }

    .hero-image {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      display: block;
    }

    .hero-shade {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.02) 0%,
          rgba(0,0,0,.03) 40%,
          rgba(0,0,0,.30) 65%,
          rgba(0,0,0,.88) 100%
        );
    }

    .hero-content {
      position: absolute;
      left: 26px;
      right: 26px;
      bottom: 27px;
      z-index: 2;
    }

    .artist-label {
      margin-bottom: 7px;
      font-size: 12px;
      letter-spacing: 4px;
      color: rgba(255,255,255,.75);
    }

    .artist-name {
      margin: 0;
      font-size: 43px;
      font-weight: 700;
      letter-spacing: 5px;

      text-shadow:
        0 2px 20px rgba(0,0,0,.6);
    }

    .artist-desc {
      margin-top: 10px;
      color: rgba(255,255,255,.82);
      font-size: 14px;
      line-height: 1.7;
    }

    .section-title {
      margin: 33px 5px 14px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #99999f;
    }

    .link-card {
      display: flex;
      align-items: center;

      width: 100%;
      min-height: 76px;

      margin-bottom: 12px;
      padding: 0 18px;

      text-decoration: none;
      color: #ffffff;

      border: 1px solid rgba(255,255,255,.09);

      border-radius: 18px;

      background: rgba(255,255,255,.085);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      transition:
        transform .18s ease,
        background .18s ease;
    }

    .link-card:active {
      transform: scale(.98);
      background: rgba(255,255,255,.15);
    }

    .logo-box {
      width: 46px;
      height: 46px;

      flex: 0 0 46px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-right: 15px;

      border-radius: 14px;

      background: rgba(255,255,255,.10);
    }

    .logo {
      width: 29px;
      height: 29px;
      display: block;
    }

    .link-text {
      flex: 1;
      min-width: 0;
    }

    .platform {
      margin-bottom: 3px;
      font-size: 18px;
      font-weight: 650;
    }

    .account {
      color: #9d9da3;
      font-size: 12px;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .arrow {
      margin-left: 10px;
      color: #96969b;
      font-size: 26px;
    }

    .future {
      margin-top: 25px;
      padding: 17px 18px;

      text-align: center;
      color: #7d7d83;

      font-size: 13px;
      line-height: 1.7;

      border: 1px dashed rgba(255,255,255,.13);
      border-radius: 16px;
    }

    footer {
      margin-top: 42px;
      text-align: center;

      color: #5f5f64;

      font-size: 11px;
      letter-spacing: 2px;
    }

    svg {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
